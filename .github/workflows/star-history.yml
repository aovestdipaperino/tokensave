name: Star History

# Regenerates the README star history chart in CI. Needed since GitHub's
# 2026-06-30 stargazers API restriction broke the hosted star-history.com
# embed. A dedicated collaborator token authenticates stargazer reads.
# No `watch` trigger: a star-triggered run is attributed to the stargazer,
# so when the run fails (e.g. expired STAR_HISTORY_TOKEN) GitHub emails the
# failure to that third party (#265). The daily schedule keeps the chart
# fresh enough.
on:
  schedule:
    - cron: '17 4 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  star-history:
    # Only the upstream repository; forks would otherwise run this daily
    # with `contents: write`.
    if: github.repository == 'aovestdipaperino/tokensave'
    runs-on: ubuntu-latest
    steps:
      - name: Verify stargazer access
        env:
          GH_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the STAR_HISTORY_TOKEN repository secret to a dedicated fine-grained collaborator token with Metadata read access."
            exit 1
          fi
          if ! gh api --method GET "repos/${GITHUB_REPOSITORY}/stargazers" -f per_page=1 --silent; then
            echo "::error::STAR_HISTORY_TOKEN could not read upstream stargazers. Check its expiration and repository access."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: narayann7/star-history-action@29310fc87122228fe128d811f14027be3ca99601 # v1.0.3
        with:
          repos: aovestdipaperino/tokensave
          # Preserve the README's absolute links to the upstream master chart.
          update-readme: false
          token: ${{ secrets.STAR_HISTORY_TOKEN }}
