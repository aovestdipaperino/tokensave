name: Documentation

# docs/guide/ is the single source of the user documentation; the GitHub Wiki
# is generated from it (scripts/wiki/sync_wiki.py). Pull requests check links,
# anchors and the wiki sidebar; pushes to master republish the wiki so it
# never drifts from the repository. Direct wiki edits are overwritten.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/guide/**'
      - 'scripts/wiki/**'
      - '.github/workflows/wiki.yml'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/guide/**'
      - 'scripts/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/wiki -v
      - name: Check links, anchors and sidebar
        run: python3 scripts/wiki/sync_wiki.py check
      - name: Build wiki pages
        run: python3 scripts/wiki/sync_wiki.py build --out "$RUNNER_TEMP/wiki" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: check
    # Only the upstream repository publishes; forks run the check job only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'aovestdipaperino/tokensave'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wiki repository exists only after its first page has been created
      # in the GitHub UI; this clone fails until then.
      - name: Clone wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
      - name: Generate pages
        run: >-
          python3 scripts/wiki/sync_wiki.py build
          --out "$RUNNER_TEMP/wiki"
          --repo "$GITHUB_REPOSITORY"
          --ref master
          --commit "$GITHUB_SHA"
      - name: Push changes
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA::12}"
          git push
