name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
    branches: [master, beta]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-14
          - name: Windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@v5

      # The Linux runner ships with ~10 GB free, which our 713 MB cache restore
      # plus the cargo target dir (34 tree-sitter parsers compiled in) can
      # exceed. See v4.5.1 CI flake: "No space left on device" mid-test.
      - name: Free disk space (Linux only)
        if: matrix.name == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-test

      - name: Run tests
        env:
          # Match macOS/Linux's 8 MB thread-stack default; Windows MSVC's 1 MB
          # default overflows async-heavy tests with STATUS_ACCESS_VIOLATION.
          RUST_MIN_STACK: "8388608"
        # `test-transport` only exposes test hooks and gates the MCP
        # transport suites (mcp_server_test, report_savings_test, ...); it
        # adds no dependencies, so this is a superset of the plain run.
        run: cargo test --workspace --locked --features test-transport

      - name: Check canonical build outputs
        run: python scripts/test-build-app.py

      - name: Check plain Cargo executable identity
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          import pathlib
          import subprocess
          import tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          beta = "-" in version
          executable = pathlib.Path("target/debug/tokensave" + (".exe" if os.name == "nt" else "")).resolve()
          expected = f"tokensave TokenSave Beta {version}" if beta else f"tokensave {version}"
          assert subprocess.check_output([str(executable), "--version"], text=True).strip() == expected
          channel = subprocess.run([str(executable), "channel"], capture_output=True, text=True, check=True)
          assert f"v{version} ({'beta' if beta else 'stable'})" in channel.stderr
          PYTHON

      - name: Check beta executable identity
        shell: bash
        run: |
          # A prerelease package already selected beta in the full test build.
          # Stable packages still need a beta-feature build; reuse the full
          # feature set and build tree rather than recompiling the lite subset.
          python - <<'PYTHON'
          import os
          import pathlib
          import subprocess
          import tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          if "-" not in version.split("+")[0]:
              subprocess.run(["cargo", "build", "--locked", "--bin", "tokensave",
                              "--features", "test-transport,beta"], check=True)
          executable = pathlib.Path("target/debug/tokensave" + (".exe" if os.name == "nt" else ""))
          subprocess.run(["python", "scripts/check-app-identity.py", "--channel", "beta",
                          str(executable)], check=True)
          PYTHON

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: rustfmt
      - run: cargo fmt --all -- --check
